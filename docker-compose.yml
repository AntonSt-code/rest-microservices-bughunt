# Налаштування трьох мікросервісів
services:

  # Сервіс авторизації
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8001:8000"

  # Сервіс каталогу товарів
  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "8002:8000"

  # Сервіс створення замовлень
  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8003:8000"

    # Адреси інших сервісів у мережі Docker
    environment:
      AUTH_URL: http://auth-service:8000
      PRODUCT_URL: http://product-service:8000

    # Залежності сервісу замовлень
    depends_on:
      - auth-service
      - product-service